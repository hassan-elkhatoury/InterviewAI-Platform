spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:interviewai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: test-only-signing-key-at-least-32-bytes-long
  ai:
    key: test-only-ai-key
