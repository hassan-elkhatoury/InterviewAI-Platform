server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 128KB
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interviewai?connectionTimeZone=UTC}
    username: ${DB_USERNAME:interviewai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: interviewai
    ttl: ${JWT_TTL:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    url: ${AI_API_URL:https://openrouter.ai/api/v1/chat/completions}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:openai/gpt-4o-mini}
    timeout: ${AI_TIMEOUT:PT90S}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
